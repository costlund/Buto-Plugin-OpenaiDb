readme:
  name: Buto-Plugin-OpenaiDb
  description: |
    Built for usage by plugin openai/api_v1. 
    - Insert request into db.
    - Get a record by tag if exist.
  item:
    -
      name: Settings
      description: |
        Theme settings.
        ````
        plugin:
          openai:
            db:
              settings: 'yml:/../buto_data/theme/(theme)/openai_db.yml'
        ````
        openai_db.yml.
        ````
        server: '127.0.0.1'
        database: 'db_name'
        user_name: '...'
        password: '...'
        ````
